name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag and release notes
        run: |
          source Scripts/common.sh
          project="$PWD"
          load_version
          test "$RELEASE_TAG" = "v$version"
          test -s "docs/release-notes-v$version.md"
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: SwiftPM tests
        run: swift test
      - name: Build release assets
        run: |
          Scripts/release.sh
          cp "docs/release-notes-$RELEASE_TAG.md" dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/Aether-v*-macos-arm64.zip
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh run download "$RUN_ID" --name release-assets --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$RELEASE_TAG" \
            "dist/Aether-$RELEASE_TAG-macos-arm64.zip" dist/SHA256SUMS \
            --verify-tag --title "Aether $RELEASE_TAG · 开发预览" \
            --notes-file dist/RELEASE_NOTES.md --prerelease --latest=false
