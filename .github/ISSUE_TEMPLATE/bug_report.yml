name: Bug report / 问题报告
description: 报告可复现的问题；安全漏洞请使用私密报告。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿附带密钥、完整配置、管理员密码或未脱敏日志。安全漏洞请按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: Aether 版本 / Version
      placeholder: v0.1.0 或 commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境 / Environment
      placeholder: macOS 版本、Apple Silicon 型号、Homebrew 工具版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps
      description: 最小可复现步骤，以及预期行为和实际行为。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据 / Redacted evidence
      description: 可附不含私钥和私人地址的截图或日志；请说明哪些操作尚未验证。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查 / Privacy check
      options:
        - label: 附件不包含密钥、管理员密码或完整私人配置。
          required: true
