name: Feature request / 功能建议
description: 描述需要解决的问题和实际使用场景。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Problem
      description: 现在什么操作受阻，影响谁，现有方式为什么不足？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望结果 / Outcome
      description: 描述可观察的行为；可附不包含私人信息的交互草图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案 / Alternatives
